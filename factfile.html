<!DOCTYPE html>
<html>
    <head>
        <title>My animal fact file</title>
        <style>
            body{background-color: blue; font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;}

            .animal-name{color: blanchedalmond;font-size: 22px;}

    </head>
    <body>
        <div class="fact-file">
            <h2 class="animal-name">Snow Leapord</h2>
            <p class="detail">Type- big cat</p>

            <p class="detail">Diet- Deer, goats, and wild sheep</p>
            <p class="cool-fact">Cool fact- can leap upto 15 meters in one jump!</p>
        </div>
    </body>
</html>
