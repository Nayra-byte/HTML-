<!DOCTYPE html>
<html>
    <head>
        <title> my superhero card </title>
        <style>
            body {background-color: rgb(224, 184, 236); color: blueviolet; font-family: Arial, Helvetica, sans-serif;}
            .hero-name {font-size: 60px; font-weight: bold; color: pink; text-shadow: 3px 3px rgb(157, 242, 189);}
            .tagline{font-style: italic; color: mediumorchid; text-transform: capitalize;}
            .power{font-weight: bold; color: lavender;}
            .label{text-transform: uppercase; text-decoration: underline; color:rgb(220, 20, 197)}
            .weakness{text-decoration: line-through; color:rgb(100, 3, 82)}
            .badge{font-size: 28px; font-weight: bold; color: rgb(174, 0, 255); transform: rotate(15deg);}
            .made-by{color: rgb(11, 57, 79); font-style: italic;}
        </style>
    </head>
    <body>
        <h1 class="hero-name">Moonlark</h1>
        <p class="tagline">Most powerful kidin elvin history</p>
        <h2 class="label">Super powers</h2>
        <p class="power">Strongest telepath in the world</p>
        <p class="power">Most abilities - Enhancer, Teleporter, Polygot, Telepath</p>
        <h2 class="label">Weaknesses</h2>
        <p class="label">Alchemistry</p>
        <p class="label">Too many healing center visits</p>
        <p class="badge">Black Swan</p>
        <p class="made-by">Created by Nayra G</p>
    </body>
</html>
