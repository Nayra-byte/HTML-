<!DOCTYPE html>
<html lang="en">
    <head>
        <title>My science labbbb</title>
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
        <style>
            body{background-color: lightcyan;font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;}
            .jumbotron{background-color: darkcyan;border-left: 6px solid indigo;}
            .jumbotron h1{color:cyan}
            .section-title{color: deepskyblue;margin-top: 30px;margin-bottom: 15px;}
            p{font-weight:bold;margin-bottom: 5px;}
        </style>
    </head>
    <body>
        <div class="jumbotron jumbotron-fluid">
            <div class="container">
                <h1>my dashboard</h1>
                <p class="lead">Welcome to myyyyyyyyy dashboard!! here are the classes that are ongoing, the succcess rate</p>
                <button class="btn btn-primary">Art</button>
                <button class="btn btn-success">TT</button>
                <button class="btn btn-warning">Basketball</button>
                <button class="btn btn-danger">Coding</button>
                <button class="btn btn-info">Math</button>
            </div>
        </div>
        <div class="container">
            <h2 class="section-title">Classes Ongoing<span class=badge badge-danger>4</span></h2>
            <p>Art<span class="badge badge-primary">3 exp</span></p>
            <p>TT<span class="badge badge-success">3 exp</span></p>
            <p>Basketball<span class="badge badge-warning">2 exp</span></p>
            <p>Coding<span class="badge badge-danger">14 exp</span></p>
            <p>Math<span class="badge badge-info">8 exp</span></p>
            <h2 class="section-title">Success rate</h2>
            <p>Art</p>
            <div class="progress mb-3"></div>
            <div class="progress-bar bg-primary" style="width:99%">99%</div>
            <p>TT</p>
            <div class="progress mb-3"></div>
            <div class="progress-bar bg-success" style="width:933%">93%</div>
            <p>Basketball</p>
            <div class="progress mb-3"></div>
            <div class="progress-bar bg-warning" style="width:98%">98%</div>
            <p>Coding</p>
            <div class="progress mb-3"></div>
            <div class="progress-bar bg-danger" style="width:100%">100%</div>
            <p>Math</p>
            <div class="progress mb-3"></div>
            <div class="progress-bar bg-info" style="width:96%">96%</div>
        </div>
    </body>
</html>
