<!DOCTYPE html>
<html>
    <head>
        <title>Munchers Menu</title>
        <style>
            body{font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;background: blanchedalmond;padding: 30px; text-align: center;}
            h1 {color:cadetblue;}
            h1+p{background: aqua;padding: 10px 20px;border-radius: 8px;color: darkseagreen;display: inline-block;}
            ul{padding: 0;margin-top: 20px;}
            ul > li{list-style: none; font-size: 18px; font-weight: bold; color: brown; padding: 10px 20px; margin: 6px auto;width: 260px; background: blueviolet; border-radius: 8px;}
            ul li:nth-child(3) {background: blue;color: darkorchid;}
            .desc{color: darkslateblue;margin-top: 20px; font-size: 15px; max-width: 400px; margin-left: auto; margin-right: auto;}
            .desc::first-letter{font-size: 220%;color: chocolate;font-weight: bold;}
            .links{margin-top: 25px;}
            a{color: coral;text-decoration: none;font-size: 15px;margin: 0 12px;padding: 8px 18px;border: 2px solid #3d00e6;border-radius: 8px;}
            a:hover{background:darkmagenta;color:cyan}
        </style>
    </head>
    <body>
        <h1>Munnnchers Menu</h1>
        <p>Pick your favourite dish and dig in!</p>
        <ul>
            <li>Tacos</li>
            <li>Sushi - Chefs special</li>
            <li>Ramen</li>
            <li>Japanese Set Meal</li>
            <li>Gelato</li>
        </ul>
        <p class="desc">Every dish is handcrafted and made special just for you@!!</p>
        <div class="links">
            <a href="#">Order Now</a>
            <a href="#">See more</a>
        </div>
    </body>
</html>
