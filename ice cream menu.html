<!DOCTYPE html>
<html>
    <head>
        <title>Cool as a cube</title>
        <style>
            body{font-family: cursive;background: rgb(247, 231, 209);padding: 30px; text-align: center;}
            h1 {color:rgb(194, 29, 192);}
            h1+p{background: rgb(26, 31, 123);padding: 10px 20px;border-radius: 8px;color: rgb(234, 237, 136);display: inline-block;}
            ul{padding: 0;margin-top: 20px;}
            ul > li{list-style: none; font-size: 18px; font-weight: bold; color: rgb(249, 248, 248); padding: 10px 20px; margin: 6px auto;width: 260px; background: blueviolet; border-radius: 8px;}
            ul li:nth-child(3) {background: rgb(129, 0, 32);color: rgb(255, 255, 255);}
            .desc{color: rgb(61, 139, 108);margin-top: 20px; font-size: 15px; max-width: 400px; margin-left: auto; margin-right: auto;}
            .desc::first-letter{font-size: 220%;color: rgb(75, 36, 8);font-weight: bold;}
            .links{margin-top: 25px;}
            a{color: rgb(245, 161, 131);text-decoration: none;font-size: 15px;margin: 0 12px;padding: 8px 18px;border: 2px solid #260a72;border-radius: 8px;}
            a:hover{background:darkmagenta;color:cyan}
        </style>
    </head>
    <body>
        <h1>Cool as a Cube</h1>
        <p>Pick your favourite Ice cream and dig in!</p>
        <ul>
            <li>Strawberry</li>
            <li>Lemon</li>
            <li>Raspberry - Chefs special</li>
            <li>Biscoff</li>
            <li>Sakura</li>
        </ul>
        <p class="desc">Every ice cream is handcrafted and made special just for you@!!</p>
        <div class="links">
            <a href="#">Order Now</a>
            <a href="#">See more</a>
        </div>
    </body>
</html>
